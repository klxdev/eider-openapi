[package]
name = "openapi"
version = "0.6.0"
eider = "0.6"
description = "OpenAPI 3.1 services on eider-http: operations registered with their routes, JSON Schema validation with problem+json errors, typed handlers, /openapi.json (docs/openapi.md)"

# the router, problem+json and middleware (body limits, bearer auth). openapi's own code is
# pure, but a grant is checked against everything the program loads of http (its server
# included), so it grants what http's modules use (docs/openapi.md "Gaps")
[deps.http]
git = "https://github.com/klxdev/eider-http.git"
version = "0.6.0"
uses = ["clock", "fs", "io", "net", "threads"]

# rendering and parsing documents and bodies; pure
[deps.json]
git = "https://github.com/klxdev/eider-json.git"
version = "0.6.0"
