[package]
name = "todo_gen"
version = "0.1.0"
eider = "0.6"
description = "The todo service rebuilt from its OpenAPI document by `eider-openapi gen` (api.ei is generated; tests/gen_test.ei serves it and calls it with the generated client)"

[deps.http]
git = "https://github.com/klxdev/eider-http.git"
version = "0.6.0"
uses = ["clock", "fs", "io", "net", "threads"]

[deps.openapi]
path = "../.."

[deps.json]
git = "https://github.com/klxdev/eider-json.git"
version = "0.6.0"
