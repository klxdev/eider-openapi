[package]
name = "todo"
version = "0.1.0"
main = "main.ei"
description = "An example REST service with an OpenAPI 3.1 description on packages/http and packages/openapi (docs/openapi.md)"

# the server and client, middleware (access log, timeouts): sockets, deadlines, worker threads
[deps.http]
path = "../../packages/http"
uses = ["net", "io", "clock", "threads"]

# operations, validation and /openapi.json; pure
[deps.openapi]
path = "../../packages/openapi"

# reading responses in the end-to-end test; pure
[deps.json]
path = "../../packages/json"
